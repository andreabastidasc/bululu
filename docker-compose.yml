x-backend-env: &backend-env
    POSTGRES_DB: ${POSTGRES_DB:-bululu}
    POSTGRES_USER: ${POSTGRES_USER:-bululu}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bululu}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,backend-prod}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
    DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-bululu}
            POSTGRES_USER: ${POSTGRES_USER:-bululu}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bululu}
        volumes:
            - db-data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./backend
            target: dev
        environment:
            <<: *backend-env
            DJANGO_DEBUG: "true"
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy

    web:
        build:
            context: ./frontend
            target: dev
        environment:
            API_URL: http://backend:8000
            WATCHPACK_POLLING: "true"
        volumes:
            - ./frontend:/app
            - /app/node_modules
            - /app/.next
        ports:
            - "3000:3000"
        depends_on:
            - backend

    backend-prod:
        profiles: ["prod"]
        build:
            context: ./backend
            target: prod
        environment:
            <<: *backend-env
            DJANGO_DEBUG: "false"
        volumes:
            - media-data:/app/media
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    web-prod:
        profiles: ["prod"]
        build:
            context: ./frontend
            target: prod
            args:
                API_URL: http://backend-prod:8000
        environment:
            API_URL: http://backend-prod:8000
        ports:
            - "3000:3000"
        depends_on:
            - backend-prod
        restart: unless-stopped

volumes:
    db-data:
    media-data:
